<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>AK Pistol Perform</title>
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#ffffff" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  --bg: #f7f8fa; --surface: #ffffff; --surface-alt: #f1f3f7; --line: #e3e7ee;
  --text: #16191f; --text-mute: #667085; --text-faint: #98a2b3;

  /* Semantic fills, plus darker variants that clear 4.5:1 as text on white. */
  --good: #059669; --good-text: #047857;
  --warn: #d97706; --warn-text: #92400e;
  --bad:  #dc2626; --bad-text:  #b91c1c;

  /* Overridden per tab in JS; dashboard blue is the default. */
  --accent: #2563eb; --accent-text: #1d4ed8; --accent-soft: rgba(37,99,235,0.08);

  --shadow: 0 1px 3px rgba(16,24,40,0.06);
  font-family: 'Archivo', -apple-system, sans-serif;
  background: var(--bg); color: var(--text);
}
.mono { font-family: 'JetBrains Mono', monospace; }
#root { min-height: 100vh; padding-bottom: 84px; position: relative; }

.topbar { position: relative; padding: 28px 20px 22px; overflow: hidden; min-height: 124px;
  background: linear-gradient(180deg, var(--accent-soft) 0%, var(--surface) 100%); border-bottom: 1px solid var(--line); }
.rings { position: absolute; top: -60px; right: -60px; width: 220px; height: 220px; opacity: 0.5; }
.eyebrow { color: var(--text-mute); font-size: 13px; margin: 0 0 4px; position: relative; z-index: 1; }
.title { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; margin: 0; position: relative; z-index: 1; }

.bottomnav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--line);
  display: flex; overflow-x: auto; z-index: 40; padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); }
.navbtn { flex: 1 0 54px; display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: none;
  color: var(--text-faint); font-size: 10px; padding: 8px 4px 6px; cursor: pointer; font-family: inherit; white-space: nowrap; }
.navbtn.active { color: var(--nav-accent, var(--accent-text)); font-weight: 600; }

.content { padding: 18px 16px 20px; max-width: 520px; margin: 0 auto; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; box-shadow: var(--shadow); }
.card + .card { margin-top: 12px; }
.section-label { font-size: 12px; color: var(--text-mute); margin: 22px 0 10px; display: flex; align-items: baseline; justify-content: space-between; }
.section-label:first-child { margin-top: 0; }

.kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow); }
.kpi-value { font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 600; line-height: 1.1; color: var(--accent-text); }
.kpi-label { color: var(--text-mute); font-size: 11.5px; margin-top: 4px; }

.hero-score { font-family: 'JetBrains Mono', monospace; font-size: 44px; font-weight: 700; line-height: 1; }
.hero-score span { font-size: 18px; color: var(--text-mute); font-weight: 500; }
.hero-delta { font-size: 13px; display: flex; align-items: center; gap: 4px; margin-top: 6px; }
.trend-up { color: var(--good-text); } .trend-down { color: var(--bad-text); } .trend-flat { color: var(--text-mute); }

.btn-primary { width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 14px;
  font-size: 15px; font-weight: 600; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; }
.btn-primary:disabled { opacity: 0.45; }
.btn-secondary { width: 100%; background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 14px;
  font-size: 15px; font-weight: 500; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; }
.btn-ghost { background: none; border: none; color: var(--text-mute); font-family: inherit; font-size: 13px; cursor: pointer; }
.fab { position: fixed; right: 18px; bottom: 84px; background: var(--accent); color: #fff; border: none; border-radius: 999px;
  width: 54px; height: 54px; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 18px rgba(16,24,40,0.22); z-index: 41; cursor: pointer; font-size: 26px; }

.label { font-size: 12px; color: var(--text-mute); margin-bottom: 5px; display: block; }
.input, .select, .textarea { width: 100%; background: var(--surface-alt); border: 1px solid var(--line); border-radius: 10px;
  padding: 11px 12px; color: var(--text); font-family: inherit; font-size: 14.5px; }
.textarea { resize: vertical; min-height: 60px; }
.field { margin-bottom: 14px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.upload { border: 1.5px dashed var(--line); background: var(--surface); border-radius: 12px; padding: 34px 16px; text-align: center; color: var(--text-mute); cursor: pointer; }

.hist-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.hist-row:last-child { border-bottom: none; }
.hist-date { font-size: 13px; color: var(--text-mute); }
.hist-score { font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 600; }

.progress-track { background: var(--surface-alt); border-radius: 999px; height: 8px; overflow: hidden; margin-top: 8px; }
.progress-fill { background: var(--accent); height: 100%; border-radius: 999px; }

.pb-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pb-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; box-shadow: var(--shadow); }
.pb-value { font-family: 'JetBrains Mono', monospace; font-size: 24px; font-weight: 700; color: var(--accent-text); }
.pb-label { font-size: 11.5px; color: var(--text-mute); margin-top: 3px; }
.pb-meta { font-size: 11px; color: var(--text-faint); margin-top: 6px; }

.gauge-wrap { display: flex; align-items: center; gap: 16px; }
.gauge-num { font-family: 'JetBrains Mono', monospace; font-size: 30px; font-weight: 700; }
.back-row { display: flex; align-items: center; gap: 6px; color: var(--text-mute); font-size: 13px; margin-bottom: 14px; cursor: pointer; }
.steps { display: flex; gap: 4px; margin-bottom: 18px; }
.step-dot { flex: 1; height: 3px; background: var(--line); border-radius: 2px; }
.step-dot.done { background: var(--accent); }
.empty { text-align: center; color: var(--text-mute); padding: 30px 10px; font-size: 13.5px; }
.spinner { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.breakdown-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.breakdown-field label { font-size: 10.5px; color: var(--text-mute); display: block; margin-bottom: 4px; }
.breakdown-field input { width: 100%; background: var(--surface-alt); border: 1px solid var(--line); border-radius: 8px;
  color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 13px; padding: 7px 6px; text-align: center; }
.error-banner { background: #fef2f2; border: 1px solid #fecaca; color: var(--bad-text); border-radius: 10px; padding: 12px; font-size: 13px; margin-bottom: 14px; }

/* ---------- shot calculator ---------- */
.calc-overlay { position: fixed; inset: 0; background: rgba(16,24,40,0.55); z-index: 60; display: flex; align-items: flex-end; justify-content: center; }
.calc-panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px 16px 0 0; width: 100%; max-width: 520px;
  padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); max-height: 92vh; overflow-y: auto; }
@media (min-width: 600px) { .calc-overlay { align-items: center; } .calc-panel { border-radius: 16px; } }
.calc-total { font-family: 'JetBrains Mono', monospace; font-size: 38px; font-weight: 700; line-height: 1; }
.calc-shots { display: flex; flex-wrap: wrap; gap: 5px; margin: 12px 0; min-height: 30px; }
.calc-chip { background: var(--surface-alt); border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px;
  font-family: 'JetBrains Mono', monospace; font-size: 13px; }
.calc-chip.x { border-color: var(--warn); color: var(--warn-text); }
.calc-pad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
/* Used at the range, sometimes in bright sun: keep keys large and high contrast. */
.calc-key { background: var(--surface-alt); border: 1px solid var(--line); border-radius: 10px; color: var(--text);
  font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700; padding: 15px 0; cursor: pointer; }
.calc-key:active { background: var(--accent); border-color: var(--accent); color: #fff; }
.calc-key.wide { grid-column: span 2; font-family: 'Archivo', sans-serif; font-size: 14px; font-weight: 600; }
.calc-key.x { border-color: var(--warn); color: var(--warn-text); }

/* ---------- portrait watermark ---------- */
.hero-portrait {
  position: absolute;
  right: -14px;
  bottom: -18px;
  height: 148px;
  opacity: 0.20;
  pointer-events: none;
  z-index: 0;
  mask-image: linear-gradient(to bottom, #000 62%, transparent 100%);
  -webkit-mask-image: linear-gradient(to bottom, #000 62%, transparent 100%);
}
@media (min-width: 600px) { .hero-portrait { height: 180px; right: 4%; } }

/* ---------- shot tally summary ---------- */
.tally-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.tally-cell { text-align: center; background: var(--surface-alt); border: 1px solid var(--line); border-radius: 8px; padding: 9px 2px; }
.tally-num { font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700; line-height: 1; }
.tally-lab { font-size: 10.5px; color: var(--text-mute); margin-top: 3px; }

/* ---------- sheet gallery ---------- */
.gal-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
@media (min-width: 600px) { .gal-grid { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 820px) { .gal-grid { grid-template-columns: repeat(4, 1fr); } }
.gal-item { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; cursor: pointer; box-shadow: var(--shadow); }
.gal-item img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: var(--surface-alt); }
.gal-meta { padding: 7px 8px; }
.gal-score { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600; }
.gal-date { font-size: 10.5px; color: var(--text-mute); margin-top: 1px; }
.lightbox { position: fixed; inset: 0; background: rgba(16,24,40,0.92); z-index: 70; display: flex; flex-direction: column;
  align-items: center; justify-content: center; padding: 20px; }
.lightbox img { max-width: 100%; max-height: 78vh; border-radius: 8px; }
.lightbox .btn-ghost { color: #fff; }
.thumb-strip { display: flex; gap: 8px; overflow-x: auto; margin-top: 10px; }
.thumb-strip img { height: 90px; border-radius: 8px; border: 1px solid var(--line); cursor: pointer; }

/* ---------- training log: segmented control ---------- */
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--surface-alt);
  border: 1px solid var(--line); border-radius: 10px; padding: 4px; margin-bottom: 16px; }
.seg button { background: none; border: none; border-radius: 8px; padding: 9px 4px; font-family: inherit;
  font-size: 13px; font-weight: 600; color: var(--text-mute); cursor: pointer; }
.seg button.on { background: var(--surface); color: var(--accent-text); box-shadow: var(--shadow); }

/* ---------- training log: attendance calendar ---------- */
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.cal-month { font-size: 15px; font-weight: 700; }
.cal-nav { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; width: 34px; height: 34px;
  font-size: 16px; color: var(--text); cursor: pointer; font-family: inherit; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.cal-dow { text-align: center; font-size: 10.5px; color: var(--text-faint); padding-bottom: 4px; }
.cal-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 9px;
  border: 1px solid var(--line); background: var(--surface); font-family: 'JetBrains Mono', monospace;
  font-size: 13px; color: var(--text); cursor: pointer; padding: 0; }
.cal-day.blank { border: none; background: none; cursor: default; }
.cal-day.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
.cal-day.today { box-shadow: 0 0 0 2px var(--accent-soft), 0 0 0 1px var(--accent); }
.cal-day:disabled { opacity: 0.45; cursor: default; }

/* ---------- training log: spending ---------- */
.cat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 4px; }
@media (min-width: 600px) { .cat-grid { grid-template-columns: repeat(5, 1fr); } }
.cat-btn { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 8px;
  font-family: inherit; font-size: 13px; font-weight: 600; color: var(--text); cursor: pointer; text-align: center; }
.cat-btn.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-text); }
.cat-dot { display: inline-block; width: 9px; height: 9px; border-radius: 999px; margin-right: 7px; flex: 0 0 auto; }
.spend-row { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.spend-row:last-child { border-bottom: none; }
.spend-main { flex: 1; min-width: 0; }
.spend-name { font-size: 13.5px; font-weight: 500; }
.spend-sub { font-size: 11.5px; color: var(--text-mute); margin-top: 2px; }
.spend-amt { font-family: 'JetBrains Mono', monospace; font-size: 14.5px; font-weight: 600; white-space: nowrap; }
.date-head { font-size: 11.5px; color: var(--text-faint); margin: 16px 0 2px; font-weight: 600; }
.tag { display: inline-block; font-size: 10px; border: 1px solid var(--line); border-radius: 999px;
  padding: 1px 7px; color: var(--text-mute); margin-left: 6px; }

/* ---------- training log: summary breakdown ---------- */
.bd-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
.bd-label { font-size: 13px; flex: 0 0 34%; display: flex; align-items: center; }
.bd-track { flex: 1; background: var(--surface-alt); border-radius: 999px; height: 9px; overflow: hidden; }
.bd-fill { height: 100%; border-radius: 999px; }
.bd-amt { font-family: 'JetBrains Mono', monospace; font-size: 13px; white-space: nowrap; }
.money-big { font-family: 'JetBrains Mono', monospace; font-size: 38px; font-weight: 700; line-height: 1; color: var(--accent-text); }

/* ---------- responsive: Samsung Fold cover screen vs unfolded screen, and tablets/desktop ---------- */
/* Fold cover screen (~320-374px wide) — slightly tighter spacing so nothing crowds */
@media (max-width: 360px) {
  .content { padding: 14px 12px 18px; }
  .kpi-grid { gap: 8px; }
  .hero-score { font-size: 38px; }
  .navbtn { font-size: 9.5px; flex: 1 0 48px; padding: 8px 2px 6px; }
  .money-big { font-size: 32px; }
}

/* Fold unfolded / small tablets (~600px+) — use the extra width instead of stretching text */
@media (min-width: 600px) {
  .content { max-width: 760px; }
  .bottomnav-inner { max-width: 760px; margin: 0 auto; }
  .kpi-grid { grid-template-columns: repeat(3, 1fr); }
  .pb-grid { grid-template-columns: repeat(3, 1fr); }
  .breakdown-grid { grid-template-columns: repeat(6, 1fr); }
}

/* Fold fully unfolded (~820px+) — two-column dashboard instead of one long scroll */
@media (min-width: 820px) {
  .content { max-width: 960px; }
  .bottomnav-inner { max-width: 960px; }
  .dash-wrap { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; align-items: start; }
  .dash-wrap > .dash-left, .dash-wrap > .dash-right { min-width: 0; }
  .kpi-grid { grid-template-columns: repeat(3, 1fr); }
  .pb-grid { grid-template-columns: repeat(4, 1fr); }
  .add-flow-inner { max-width: 480px; margin: 0 auto; }
}
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;
const h = React.createElement;

/* ---------- helpers ---------- */
function fmtShort(d) { const dt = new Date(d + "T00:00:00"); return dt.toLocaleDateString("en-GB", { day: "2-digit", month: "short" }); }
function fmtLong(d) { const dt = new Date(d + "T00:00:00"); return dt.toLocaleDateString("en-GB", { day: "2-digit", month: "long", year: "numeric" }); }
function avg(a) { return a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0; }
function stdev(a) { if (a.length < 2) return 0; const m = avg(a); return Math.sqrt(avg(a.map(v => (v - m) ** 2))); }
function round1(n) { return Math.round(n * 10) / 10; }
function daysAgo(d, ref) { return Math.round((new Date(ref + "T00:00:00") - new Date(d + "T00:00:00")) / 86400000); }

/* ---------- training log helpers ---------- */
// Postgres returns NUMERIC as a string, so amounts are coerced on the way in.
function mapExpense(r) {
  return {
    id: r.id, date: r.spend_date, category: r.category, itemName: r.item_name,
    amount: Number(r.amount) || 0, quantity: r.quantity == null ? null : Number(r.quantity),
    purchaseSource: r.purchase_source, vendor: r.vendor, notes: r.notes,
  };
}
function mapAttendance(r) { return { id: r.id, date: r.attend_date, notes: r.notes }; }

const CATEGORIES = [
  { key: 'class_fee', label: 'Class fee', color: '#2563eb' },
  { key: 'accessory', label: 'Accessory', color: '#7c3aed' },
  { key: 'pellets', label: 'Pellets', color: '#059669' },
  { key: 'cylinder_refill', label: 'Cylinder refill', color: '#0891b2' },
  { key: 'sheets', label: 'Sheets', color: '#d97706' },
];
function categoryOf(key) { return CATEGORIES.find(c => c.key === key) || { key, label: key, color: '#98a2b3' }; }

// ₹1,250 — paise only shown when the amount actually has them.
function money(n) {
  const v = Number(n) || 0;
  const hasPaise = Math.round(v * 100) % 100 !== 0;
  return '₹' + v.toLocaleString('en-IN', {
    minimumFractionDigits: hasPaise ? 2 : 0, maximumFractionDigits: hasPaise ? 2 : 0,
  });
}
function monthKey(dateStr) { return (dateStr || '').slice(0, 7); }
function todayISO() { return new Date().toISOString().slice(0, 10); }
function monthLabel(key) {
  const d = new Date(key + '-01T00:00:00');
  return d.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
}
function shiftMonth(key, delta) {
  const [y, m] = key.split('-').map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
}
function plural(n, word) { return `${n} ${word}${n === 1 ? '' : 's'}`; }

/* ---------- per-tab theming ----------
   `accent` fills shapes; `text` is the darkened variant used wherever the colour
   sits on white as text, so every pairing clears WCAG AA (4.5:1). */
const TAB_THEME = {
  dashboard: { accent: '#2563eb', text: '#1d4ed8', soft: 'rgba(37,99,235,0.08)' },
  history:   { accent: '#7c3aed', text: '#6d28d9', soft: 'rgba(124,58,237,0.08)' },
  progress:  { accent: '#059669', text: '#047857', soft: 'rgba(5,150,105,0.08)' },
  bests:     { accent: '#d97706', text: '#92400e', soft: 'rgba(217,119,6,0.08)' },
  shots:     { accent: '#dc2626', text: '#b91c1c', soft: 'rgba(220,38,38,0.08)' },
  sheets:    { accent: '#0891b2', text: '#155e75', soft: 'rgba(8,145,178,0.08)' },
  training:  { accent: '#db2777', text: '#be185d', soft: 'rgba(219,39,119,0.08)' },
};
const NAV_TABS = ['dashboard', 'history', 'progress', 'bests', 'shots', 'sheets', 'training'];
// Short labels so seven tabs stay readable on a narrow phone.
const NAV_LABELS = {
  dashboard: 'Home', history: 'History', progress: 'Progress',
  bests: 'Bests', shots: 'Shots', sheets: 'Sheets', training: 'Training',
};

function mapRow(r) {
  return {
    id: r.id, date: r.session_date, sessionNumber: r.session_number, discipline: r.discipline, distance: r.distance,
    totalShots: r.total_shots, totalScore: r.total_score, maxScore: r.max_score, xCount: r.x_count,
    series: r.series || [], shotBreakdown: r.shot_breakdown, notes: r.notes || {}, photoKey: r.photo_key,
  };
}
function deriveSession(s) {
  return { ...s, percentage: s.maxScore ? (s.totalScore / s.maxScore) * 100 : 0, averageScore: s.totalShots ? s.totalScore / s.totalShots : 0 };
}
// Sheets may be stored as plain numbers (older sessions) or {sheet, score} objects.
function sheetList(s) {
  const raw = (s && s.series) || [];
  return raw.map((v, i) => (typeof v === 'number'
    ? { sheet: i + 1, score: v, shots: [], photoKey: null }
    : { sheet: v.sheet ?? i + 1, score: v.score ?? 0, shots: v.shots || [], photoKey: v.photoKey || null }));
}
function sheetScores(s) { return sheetList(s).map(x => x.score); }
const SHOTS_PER_SHEET = 10;
const MAX_PER_SHEET = 100;
function consistencyScore(sessions) {
  if (sessions.length < 2) return null;
  // Compare per-sheet averages so sessions of different lengths are comparable.
  const scores = sessions.map(s => { const sc = sheetScores(s); return sc.length ? avg(sc) : (s.maxScore ? (s.totalScore / s.maxScore) * MAX_PER_SHEET : 0); });
  const cv = avg(scores) ? stdev(scores) / avg(scores) : 0;
  return Math.max(0, Math.min(100, Math.round(100 - cv * 400)));
}
function breakdownStats(b) {
  if (!b) return null;
  const { ten = 0, nine = 0, eight = 0, seven = 0, six = 0, fiveDown = 0 } = b;
  const total = ten + nine + eight + seven + six + fiveDown;
  if (!total) return null;
  return { ten, nine, eight, seven, six, fiveDown, total, high: ten + nine, low: eight + seven + six + fiveDown, ninePlusPct: round1(((ten + nine) / total) * 100) };
}

/* ---------- tiny inline chart (no external chart library) ---------- */
function SimpleLineChart({ points, height = 150 }) {
  const width = 320;
  if (points.length === 0) return h('div', { style: { color: 'var(--text-mute)', fontSize: 13 } }, 'No data yet');
  const vals = points.map(p => p.value);
  const min = Math.min(...vals), max = Math.max(...vals);
  const pad = (max - min) * 0.15 || 5;
  const yMin = min - pad, yMax = max + pad;
  const stepX = points.length > 1 ? width / (points.length - 1) : 0;
  const coords = points.map((p, i) => [i * stepX, height - ((p.value - yMin) / (yMax - yMin)) * (height - 20) - 10]);
  const path = coords.map((c, i) => (i === 0 ? "M" : "L") + c[0].toFixed(1) + "," + c[1].toFixed(1)).join(" ");
  return h('svg', { viewBox: `0 0 ${width} ${height}`, style: { width: '100%', height } },
    h('path', { d: path, fill: 'none', stroke: 'var(--accent)', strokeWidth: 2 }),
    coords.map((c, i) => h('circle', { key: i, cx: c[0], cy: c[1], r: 3, fill: 'var(--accent)' })),
    points.map((p, i) => i % Math.ceil(points.length / 6 || 1) === 0 &&
      h('text', { key: 'l' + i, x: coords[i][0], y: height - 2, fontSize: 9, fill: 'var(--text-faint)', textAnchor: 'middle' }, p.label))
  );
}
function SimpleBarChart({ points, height = 150, colorFn }) {
  const width = 320;
  const vals = points.map(p => p.value);
  const max = Math.max(...vals, 1);
  const barW = width / points.length - 8;
  return h('svg', { viewBox: `0 0 ${width} ${height}`, style: { width: '100%', height } },
    points.map((p, i) => {
      const barH = (p.value / max) * (height - 24);
      const x = i * (width / points.length) + 4;
      const y = height - 20 - barH;
      return h(React.Fragment, { key: i },
        h('rect', { x, y, width: barW, height: barH, fill: colorFn ? colorFn(i) : 'var(--accent)', rx: 3 }),
        h('text', { x: x + barW / 2, y: height - 6, fontSize: 9, fill: 'var(--text-faint)', textAnchor: 'middle' }, p.label),
        h('text', { x: x + barW / 2, y: y - 4, fontSize: 9, fill: 'var(--text-mute)', textAnchor: 'middle' }, p.value)
      );
    })
  );
}

function TrendIndicator({ value, suffix = "" }) {
  if (value === null || value === undefined || Number.isNaN(value)) return null;
  const flat = Math.abs(value) < 0.05;
  const up = value > 0;
  return h('span', { className: `hero-delta ${flat ? 'trend-flat' : up ? 'trend-up' : 'trend-down'}` },
    (flat ? '· ' : up ? '↑ ' : '↓ ') + (flat ? 'flat' : `${value > 0 ? '+' : ''}${round1(value)}${suffix}`));
}

/* ---------- Progress ---------- */
function ProgressTab({ sessionsAsc }) {
  const [grouping, setGrouping] = useState('day');
  if (sessionsAsc.length === 0) return h('div', { className: 'empty' }, 'No sessions logged yet.');

  // Average per sheet (out of 100) is the fair comparison — a 4-sheet day
  // and a 2-sheet day can't be compared on total score alone.
  function perSheet(s) {
    const sc = sheetScores(s);
    return sc.length ? avg(sc) : (s.maxScore ? (s.totalScore / s.maxScore) * MAX_PER_SHEET : 0);
  }

  function weekStart(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    const day = (d.getDay() + 6) % 7; // Monday = 0
    d.setDate(d.getDate() - day);
    return d.toISOString().slice(0, 10);
  }
  function keyFor(s) {
    if (grouping === 'day') return s.date;
    if (grouping === 'week') return weekStart(s.date);
    return s.date.slice(0, 7);
  }
  function labelFor(key) {
    if (grouping === 'day') return fmtShort(key);
    if (grouping === 'week') return fmtShort(key);
    const d = new Date(key + '-01T00:00:00');
    return d.toLocaleDateString('en-GB', { month: 'short' });
  }

  // Group sessions into periods, newest last.
  const groups = {};
  sessionsAsc.forEach(s => {
    const k = keyFor(s);
    if (!groups[k]) groups[k] = [];
    groups[k].push(s);
  });
  const keys = Object.keys(groups).sort();
  const periods = keys.map(k => {
    const list = groups[k];
    const allSheets = list.flatMap(s => sheetScores(s));
    const shots = list.reduce((a, s) => a + (s.totalShots || 0), 0);
    const bd = list.map(s => s.shotBreakdown).filter(Boolean);
    const tens = bd.reduce((a, b) => a + (b.ten || 0), 0);
    const nines = bd.reduce((a, b) => a + (b.nine || 0), 0);
    const counted = bd.reduce((a, b) => a + (b.ten || 0) + (b.nine || 0) + (b.eight || 0) + (b.seven || 0) + (b.six || 0) + (b.fiveDown || 0), 0);
    return {
      key: k, label: labelFor(k),
      avgSheet: round1(avg(list.map(perSheet))),
      best: allSheets.length ? Math.max(...allSheets) : 0,
      sessions: list.length, sheets: allSheets.length, shots,
      ninePlus: counted ? round1(((tens + nines) / counted) * 100) : null,
      xCount: list.reduce((a, s) => a + (s.xCount || 0), 0),
    };
  });

  const shown = periods.slice(-12);
  const latest = periods[periods.length - 1];
  const prev = periods.length > 1 ? periods[periods.length - 2] : null;
  const change = prev ? round1(latest.avgSheet - prev.avgSheet) : null;

  // Is the recent half better than the earlier half?
  const half = Math.floor(periods.length / 2);
  const earlier = periods.slice(0, half).map(p => p.avgSheet);
  const recent = periods.slice(half).map(p => p.avgSheet);
  const overall = earlier.length && recent.length ? round1(avg(recent) - avg(earlier)) : null;

  const bestPeriod = periods.reduce((a, b) => b.avgSheet > a.avgSheet ? b : a, periods[0]);
  const maxAvg = Math.max(...shown.map(p => p.avgSheet));
  const periodWord = grouping === 'day' ? 'day' : grouping === 'week' ? 'week' : 'month';

  return h(React.Fragment, null,
    h('div', { style: { display: 'flex', gap: 6, marginBottom: 16 } },
      [['day', 'Daily'], ['week', 'Weekly'], ['month', 'Monthly']].map(([k, label]) =>
        h('button', {
          key: k,
          className: grouping === k ? 'btn-primary' : 'btn-secondary',
          style: { padding: '9px 0', fontSize: 13.5 },
          onClick: () => setGrouping(k),
        }, label))),

    h('div', { className: 'section-label', style: { marginTop: 0 } },
      h('span', null, `Average per sheet, by ${periodWord}`),
      h('span', null, `out of ${MAX_PER_SHEET}`)),
    h('div', { className: 'card' },
      h(SimpleBarChart, {
        points: shown.map(p => ({ label: p.label, value: p.avgSheet })),
        height: 180,
        colorFn: i => shown[i].avgSheet === maxAvg ? '#059669' : '#d97706',
      }),
      h('p', { style: { fontSize: 11.5, color: 'var(--text-faint)', margin: '6px 4px 0' } },
        'Average of every sheet shot in that period — comparable whether you shot 2 sheets or 5.')),

    h('div', { className: 'kpi-grid' },
      h('div', { className: 'kpi' },
        h('div', { className: 'kpi-value' }, latest.avgSheet),
        h('div', { className: 'kpi-label' }, `This ${periodWord}'s average`)),
      h('div', { className: 'kpi' },
        h('div', { className: 'kpi-value', style: { color: change === null ? 'var(--text)' : change > 0 ? 'var(--good-text)' : change < 0 ? 'var(--bad-text)' : 'var(--text)' } },
          change === null ? '—' : `${change > 0 ? '+' : ''}${change}`),
        h('div', { className: 'kpi-label' }, `vs previous ${periodWord}`)),
      h('div', { className: 'kpi' },
        h('div', { className: 'kpi-value' }, bestPeriod.avgSheet),
        h('div', { className: 'kpi-label' }, `Best ${periodWord} (${bestPeriod.label})`)),
      h('div', { className: 'kpi' },
        h('div', { className: 'kpi-value' }, latest.ninePlus === null ? '—' : latest.ninePlus + '%'),
        h('div', { className: 'kpi-label' }, '9+ this ' + periodWord))),

    overall !== null && h(React.Fragment, null,
      h('div', { className: 'section-label' }, 'Overall direction'),
      h('div', { className: 'card' },
        h('div', { style: { display: 'flex', alignItems: 'center', gap: 14 } },
          h('div', { className: 'gauge-num', style: { color: overall > 0.5 ? 'var(--good-text)' : overall < -0.5 ? 'var(--bad-text)' : 'var(--text-mute)' } },
            `${overall > 0 ? '+' : ''}${overall}`),
          h('p', { style: { margin: 0, fontSize: 13, color: 'var(--text-mute)', lineHeight: 1.5 } },
            overall > 0.5
              ? `Your recent ${periodWord}s average ${Math.abs(overall)} points more per sheet than your earlier ones. That is real improvement, not just a good day.`
              : overall < -0.5
                ? `Your recent ${periodWord}s average ${Math.abs(overall)} points less per sheet than earlier. Worth looking at what changed.`
                : `Your average per sheet has held roughly steady across the period.`)))),

    h('div', { className: 'section-label' }, `Every ${periodWord}`),
    h('div', { className: 'card' },
      [...periods].reverse().map((p, i) => {
        const earlierP = periods[periods.length - 2 - i];
        const d = earlierP ? round1(p.avgSheet - earlierP.avgSheet) : null;
        return h('div', { key: p.key, className: 'hist-row', style: { cursor: 'default' } },
          h('div', null,
            h('div', { style: { fontSize: 13.5 } }, p.label),
            h('div', { style: { fontSize: 11, color: 'var(--text-faint)', marginTop: 2 } },
              `${p.sheets} sheet${p.sheets === 1 ? '' : 's'} · ${p.shots} shots${p.xCount ? ' · ' + p.xCount + ' X' : ''}`)),
          h('div', { style: { textAlign: 'right' } },
            h('div', { className: 'hist-score' }, p.avgSheet),
            d === null ? null : h('div', { style: { fontSize: 11, color: d > 0 ? 'var(--good-text)' : d < 0 ? 'var(--bad-text)' : 'var(--text-mute)' } },
              `${d > 0 ? '+' : ''}${d}`)));
      })));
}

/* ---------- Personal bests ---------- */
function BestsTab({ sessions }) {
  if (sessions.length === 0) return h('div', { className: 'empty' }, 'No sessions logged yet.');
  const bestScore = sessions.reduce((a, b) => b.totalScore > a.totalScore ? b : a, sessions[0]);
  const bestAvg = sessions.reduce((a, b) => deriveSession(b).averageScore > deriveSession(a).averageScore ? b : a, sessions[0]);
  const bestX = sessions.reduce((a, b) => (b.xCount || 0) > (a.xCount || 0) ? b : a, sessions[0]);
  const bestSeries = sessions.reduce((acc, s) => { const sc = sheetScores(s); const m = sc.length ? Math.max(...sc) : 0; return m > acc.value ? { value: m, session: s } : acc; }, { value: -1, session: sessions[0] });

    Card(round1(deriveSession(bestAvg).averageScore), 'Highest average', bestAvg),
    Card(bestX.xCount || 0, 'Most Xs', bestX),
    Card(bestSeries.value, 'Best single sheet', bestSeries.session));
}

/* ---------- Crop tool: trim the photo to just the sheet before saving ---------- */
function CropTool({ src, onDone, onCancel }) {
  const imgRef = useRef(null);
  const boxRef = useRef(null);
  const [box, setBox] = useState({ x: 8, y: 8, w: 84, h: 84 }); // percentages
  const drag = useRef(null);

  function startDrag(mode, e) {
    e.preventDefault();
    e.stopPropagation();
    const pt = e.touches ? e.touches[0] : e;
    drag.current = { mode, startX: pt.clientX, startY: pt.clientY, box: { ...box } };
  }
  function onMove(e) {
    if (!drag.current || !boxRef.current) return;
    const pt = e.touches ? e.touches[0] : e;
    const rect = boxRef.current.getBoundingClientRect();
    const dx = ((pt.clientX - drag.current.startX) / rect.width) * 100;
    const dy = ((pt.clientY - drag.current.startY) / rect.height) * 100;
    const b = drag.current.box;
    if (drag.current.mode === 'move') {
      setBox({ ...b, x: Math.min(100 - b.w, Math.max(0, b.x + dx)), y: Math.min(100 - b.h, Math.max(0, b.y + dy)) });
    } else {
      setBox({ ...b, w: Math.min(100 - b.x, Math.max(15, b.w + dx)), h: Math.min(100 - b.y, Math.max(15, b.h + dy)) });
    }
  }
  function endDrag() { drag.current = null; }

  function apply() {
    const img = imgRef.current;
    if (!img) return;
    const nw = img.naturalWidth, nh = img.naturalHeight;
    const canvas = document.createElement('canvas');
    canvas.width = Math.round((box.w / 100) * nw);
    canvas.height = Math.round((box.h / 100) * nh);
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, (box.x / 100) * nw, (box.y / 100) * nh, canvas.width, canvas.height, 0, 0, canvas.width, canvas.height);
    onDone(canvas.toDataURL('image/jpeg', 0.9));
  }

  return h('div', { className: 'calc-overlay', onMouseMove: onMove, onMouseUp: endDrag, onTouchMove: onMove, onTouchEnd: endDrag },
    h('div', { className: 'calc-panel' },
      h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12 } },
        h('span', { style: { fontSize: 15, fontWeight: 600 } }, 'Crop to the sheet'),
        h('button', { className: 'btn-ghost', style: { fontSize: 20 }, onClick: onCancel }, '✕')),
      h('p', { style: { fontSize: 12, color: 'var(--text-mute)', margin: '0 0 10px' } }, 'Drag the box to move it, or the corner handle to resize.'),
      h('div', { ref: boxRef, style: { position: 'relative', userSelect: 'none', touchAction: 'none' } },
        h('img', { ref: imgRef, src, alt: 'Crop', style: { width: '100%', display: 'block', borderRadius: 4 } }),
        h('div', {
          onMouseDown: e => startDrag('move', e), onTouchStart: e => startDrag('move', e),
          style: {
            position: 'absolute', left: box.x + '%', top: box.y + '%', width: box.w + '%', height: box.h + '%',
            border: '2px solid var(--bad-text)', boxShadow: '0 0 0 9999px rgba(10,12,14,0.55)', cursor: 'move',
          } },
          h('div', {
            onMouseDown: e => startDrag('resize', e), onTouchStart: e => startDrag('resize', e),
            style: {
              position: 'absolute', right: -11, bottom: -11, width: 24, height: 24, borderRadius: '50%',
              background: 'var(--bad-text)', border: '2px solid var(--text)', cursor: 'nwse-resize',
            } }))),
      h('div', { style: { display: 'flex', gap: 8, marginTop: 14 } },
        h('button', { className: 'btn-secondary', onClick: () => onDone(src) }, 'Use full photo'),
        h('button', { className: 'btn-primary', onClick: apply }, 'Crop & save'))));
}

/* ---------- Training log: attendance + spending ---------- */
function weekStartOf(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); // Monday = start of week
  return d.toISOString().slice(0, 10);
}

function TrainingTab({ sessions }) {
  const [view, setView] = useState('attendance');

  const [expenses, setExpenses] = useState([]);
  const [loading, setLoading] = useState(true);
  const [failed, setFailed] = useState(false);

  useEffect(() => {
    Promise.all([api.listAttendance(), api.listExpenses()])
      .then(([a, e]) => { setAttendance(a); setExpenses(e); setLoading(false); })
      .catch(() => { setLoading(false); setFailed(true); });
  }, []);

  if (loading) return h('div', { className: 'empty' }, h('span', { className: 'mono spinner' }, '◐'));

  return h(React.Fragment, null,
    failed && h('div', { className: 'error-banner' }, "Couldn't load your training log. Refresh, or check back shortly."),
    h('div', { className: 'seg' },
      [['attendance', 'Attendance'], ['spending', 'Spending'], ['summary', 'Summary']].map(([k, label]) =>

    view === 'attendance' && h(AttendanceView, { attendance, setAttendance }),
    view === 'spending' && h(SpendingView, { expenses, setExpenses }),
    view === 'summary' && h(SummaryView, { attendance, expenses, sessions }));
}

function AttendanceView({ attendance, setAttendance }) {
  const [month, setMonth] = useState(monthKey(todayISO()));
  const [busy, setBusy] = useState(null);
  const today = todayISO();

  const byDate = {};
  attendance.forEach(a => { byDate[a.date] = a; });

  const thisMonth = attendance.filter(a => monthKey(a.date) === month).length;
  const lastMonthKey = shiftMonth(month, -1);
  const lastMonth = attendance.filter(a => monthKey(a.date) === lastMonthKey).length;
  const diff = thisMonth - lastMonth;

  // Consecutive weeks with at least one class, counting back from the most recent.
  const weeks = new Set(attendance.map(a => weekStartOf(a.date)));
  let streak = 0;
  if (weeks.size) {
    let cursor = weekStartOf(today);
    if (!weeks.has(cursor)) cursor = weekStartOf(new Date(Date.parse(cursor + 'T00:00:00') - 7 * 86400000).toISOString().slice(0, 10));
    while (weeks.has(cursor)) {
      streak += 1;
      cursor = new Date(Date.parse(cursor + 'T00:00:00') - 7 * 86400000).toISOString().slice(0, 10);
    }
  }

  const [y, m] = month.split('-').map(Number);
  const firstDow = new Date(y, m - 1, 1).getDay(); // 0 = Sunday
  const daysInMonth = new Date(y, m, 0).getDate();

  function toggle(dateStr) {
    if (busy) return;
    setBusy(dateStr);
    const existing = byDate[dateStr];
    if (existing) {
      api.removeAttendance(existing.id)
        .then(() => setAttendance(prev => prev.filter(a => a.id !== existing.id)))
        .finally(() => setBusy(null));
    } else {
      api.addAttendance(dateStr)
        .then(row => setAttendance(prev => prev.some(a => a.id === row.id) ? prev : [...prev, row]))
        .finally(() => setBusy(null));
    }
  }

  const cells = [];
  for (let i = 0; i < firstDow; i++) cells.push(h('div', { key: 'b' + i, className: 'cal-day blank' }));
  for (let day = 1; day <= daysInMonth; day++) {
    const dateStr = `${month}-${String(day).padStart(2, '0')}`;
    const on = !!byDate[dateStr];
    cells.push(h('button', {
      key: dateStr,
      className: `cal-day${on ? ' on' : ''}${dateStr === today ? ' today' : ''}`,
      disabled: busy === dateStr,
      onClick: () => toggle(dateStr),
      'aria-pressed': on,
      'aria-label': `${fmtLong(dateStr)}${on ? ' — attended' : ''}`,
    }, day));
  }

  return h(React.Fragment, null,
    h('div', { className: 'card' },
      h('div', { className: 'cal-head' },
        h('button', { className: 'cal-nav', onClick: () => setMonth(shiftMonth(month, -1)), 'aria-label': 'Previous month' }, '‹'),
        h('div', { className: 'cal-month' }, monthLabel(month)),
        h('button', { className: 'cal-nav', onClick: () => setMonth(shiftMonth(month, 1)), 'aria-label': 'Next month' }, '›')),
      h('div', { className: 'cal-grid' },
        ['S', 'M', 'T', 'W', 'T', 'F', 'S'].map((d, i) => h('div', { key: 'd' + i, className: 'cal-dow' }, d)),
        cells),
      h('p', { style: { fontSize: 11.5, color: 'var(--text-faint)', margin: '12px 0 0' } },
        'Tap a day to mark a class. Tap again to remove it.')),

    h('div', { className: 'section-label' }, 'This month'),
    h('div', { className: 'card' },
      h('div', { className: 'money-big' }, thisMonth, h('span', { style: { fontSize: 16, color: 'var(--text-mute)', fontWeight: 500 } }, thisMonth === 1 ? ' class' : ' classes')),
      h('p', { style: { margin: '8px 0 0', fontSize: 13, color: 'var(--text-mute)' } },
        `Last month: ${lastMonth}`),
      h('p', { style: { margin: '4px 0 0', fontSize: 13, color: diff > 0 ? 'var(--good-text)' : diff < 0 ? 'var(--bad-text)' : 'var(--text-mute)' } },
        lastMonth === 0 && thisMonth === 0 ? 'No classes logged either month.'
          : diff === 0 ? 'Same as last month.'
          : `${Math.abs(diff)} ${diff > 0 ? 'more' : 'fewer'} than last month`)),

    streak > 0 && h(React.Fragment, null,
      h('div', { className: 'section-label' }, 'Streak'),
      h('div', { className: 'card gauge-wrap' },
        h('div', { className: 'gauge-num', style: { color: 'var(--accent-text)' } }, streak),
        h('p', { style: { margin: 0, fontSize: 13, color: 'var(--text-mute)' } },
          `${plural(streak, 'week')} in a row with at least one class.`))));
}

function SpendingView({ expenses, setExpenses }) {
  const [adding, setAdding] = useState(false);
  const [confirmId, setConfirmId] = useState(null);

  function remove(id) {
    api.removeExpense(id).then(() => setExpenses(prev => prev.filter(e => e.id !== id)));
    setConfirmId(null);
  }

  if (adding) return h(SpendingForm, {
    onCancel: () => setAdding(false),
    onSaved: (row) => { setExpenses(prev => [row, ...prev]); setAdding(false); },
  });

  // Newest first, grouped under date headings.
  const sorted = [...expenses].sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : b.id - a.id));
  const groups = [];
  sorted.forEach(e => {
    const last = groups[groups.length - 1];
    if (last && last.date === e.date) last.rows.push(e);
    else groups.push({ date: e.date, rows: [e] });
  });

  return h(React.Fragment, null,
    h('button', { className: 'btn-primary', onClick: () => setAdding(true) }, '+ Add spending'),
    expenses.length === 0
      ? h('div', { className: 'empty' }, 'Nothing logged yet. Add a class fee, pellets or an accessory to start tracking what this costs.')
      : groups.map(g => h(React.Fragment, { key: g.date },
          h('div', { className: 'date-head' }, fmtLong(g.date)),
          h('div', { className: 'card' }, g.rows.map(e => {
            const cat = categoryOf(e.category);
            const bits = [];
            if (e.quantity) bits.push(e.category === 'pellets' ? plural(e.quantity, 'box') : e.category === 'sheets' ? plural(e.quantity, 'sheet') : plural(e.quantity, 'refill'));
            if (e.vendor) bits.push(e.vendor);
            return h('div', { key: e.id, className: 'spend-row' },
              h('span', { className: 'cat-dot', style: { background: cat.color } }),
              h('div', { className: 'spend-main' },
                h('div', { className: 'spend-name' }, e.itemName || cat.label,
                  e.category === 'pellets' && e.purchaseSource && h('span', { className: 'tag' }, e.purchaseSource === 'online' ? 'Online' : 'Shop')),
                bits.length > 0 && h('div', { className: 'spend-sub' }, bits.join(' · '))),
              h('span', { className: 'spend-amt' }, money(e.amount)),
              confirmId === e.id
                ? h('span', { style: { display: 'flex', gap: 6 } },
                    h('button', { className: 'btn-ghost', style: { color: 'var(--bad-text)', fontWeight: 600 }, onClick: () => remove(e.id) }, 'Delete'),
                    h('button', { className: 'btn-ghost', onClick: () => setConfirmId(null) }, 'No'))
                : h('button', { className: 'btn-ghost', style: { fontSize: 16 }, onClick: () => setConfirmId(e.id), 'aria-label': 'Delete entry' }, '×'));
          }))))
  );
}

function SummaryView({ attendance, expenses, sessions }) {
  const [month, setMonth] = useState(monthKey(todayISO()));

  const inMonth = expenses.filter(e => monthKey(e.date) === month);
  const total = inMonth.reduce((a, e) => a + e.amount, 0);
  const prevKey = shiftMonth(month, -1);
  const prevTotal = expenses.filter(e => monthKey(e.date) === prevKey).reduce((a, e) => a + e.amount, 0);
  const delta = total - prevTotal;

  const sumWhere = (key, field) => inMonth.filter(e => e.category === key).reduce((a, e) => a + (field === 'amount' ? e.amount : (e.quantity || 0)), 0);
  const classFees = sumWhere('class_fee', 'amount');
  const pelletBoxes = sumWhere('pellets', 'qty');
  const refills = sumWhere('cylinder_refill', 'qty');
  const sheetsBought = sumWhere('sheets', 'qty');

  const classes = attendance.filter(a => monthKey(a.date) === month).length;
  const sheetsShot = sessions.filter(s => monthKey(s.date) === month).reduce((a, s) => a + sheetList(s).length, 0);

  // Both guarded — a month with no classes or no sheets shot must not divide by zero.
  const costPerClass = classes > 0 ? classFees / classes : null;
  const costPerSheet = sheetsShot > 0 ? total / sheetsShot : null;

  const breakdown = CATEGORIES
    .map(c => ({ ...c, amount: inMonth.filter(e => e.category === c.key).reduce((a, e) => a + e.amount, 0) }))
    .filter(c => c.amount > 0)
    .sort((a, b) => b.amount - a.amount);

  // Totals for the last six months ending at the selected one.
  const trail = [];
  for (let i = 5; i >= 0; i--) {
    const k = shiftMonth(month, -i);
    trail.push({
      label: new Date(k + '-01T00:00:00').toLocaleDateString('en-GB', { month: 'short' }),
      value: Math.round(expenses.filter(e => monthKey(e.date) === k).reduce((a, e) => a + e.amount, 0)),
    });
  }

  return h(React.Fragment, null,
    h('div', { className: 'cal-head' },
      h('button', { className: 'cal-nav', onClick: () => setMonth(shiftMonth(month, -1)), 'aria-label': 'Previous month' }, '‹'),
      h('div', { className: 'cal-month' }, monthLabel(month)),
      h('button', { className: 'cal-nav', onClick: () => setMonth(shiftMonth(month, 1)), 'aria-label': 'Next month' }, '›')),

    h('div', { className: 'card' },
      h('p', { className: 'label', style: { marginBottom: 6 } }, 'Total spent this month'),
      h('div', { className: 'money-big' }, money(total)),
      h('p', { style: { margin: '8px 0 0', fontSize: 13, color: delta > 0 ? 'var(--bad-text)' : delta < 0 ? 'var(--good-text)' : 'var(--text-mute)' } },
        prevTotal === 0 && total === 0 ? 'Nothing logged this month or last.'
          : delta === 0 ? 'Same as last month.'
          : `${money(Math.abs(delta))} ${delta > 0 ? 'more' : 'less'} than last month`)),

    breakdown.length > 0 && h(React.Fragment, null,
      h('div', { className: 'section-label' }, h('span', null, 'Where it went'), h('span', null, `${breakdown.length} categories`)),
      h('div', { className: 'card' }, breakdown.map(c => {
        const pct = total > 0 ? Math.round((c.amount / total) * 100) : 0;
        return h('div', { key: c.key, className: 'bd-row' },
          h('span', { className: 'bd-label' }, h('span', { className: 'cat-dot', style: { background: c.color } }), c.label),
          h('span', { className: 'bd-track' }, h('span', { className: 'bd-fill', style: { width: `${pct}%`, background: c.color, display: 'block', height: '100%' } })),
          h('span', { className: 'bd-amt' }, money(c.amount)),
          h('span', { style: { fontSize: 11.5, color: 'var(--text-faint)', width: 34, textAlign: 'right' } }, pct + '%'));
      }))),

    h('div', { className: 'kpi-grid' },
      h('div', { className: 'kpi' }, h('div', { className: 'kpi-value' }, classes), h('div', { className: 'kpi-label' }, 'Classes attended')),
      h('div', { className: 'kpi' }, h('div', { className: 'kpi-value' }, pelletBoxes), h('div', { className: 'kpi-label' }, 'Pellet boxes')),
      h('div', { className: 'kpi' }, h('div', { className: 'kpi-value' }, refills), h('div', { className: 'kpi-label' }, 'Cylinder refills')),
      h('div', { className: 'kpi' }, h('div', { className: 'kpi-value' }, sheetsBought), h('div', { className: 'kpi-label' }, 'Sheets bought')),
      h('div', { className: 'kpi' }, h('div', { className: 'kpi-value' }, costPerClass === null ? '—' : money(Math.round(costPerClass))), h('div', { className: 'kpi-label' }, 'Cost per class')),
      h('div', { className: 'kpi' }, h('div', { className: 'kpi-value' }, costPerSheet === null ? '—' : money(Math.round(costPerSheet))), h('div', { className: 'kpi-label' }, 'Cost per sheet shot'))),

    h('p', { style: { fontSize: 11.5, color: 'var(--text-faint)', margin: '10px 2px 0' } },
      costPerSheet === null
        ? 'Cost per sheet appears once you have logged sheets shot in this month.'
        : `Based on ${plural(sheetsShot, 'sheet')} actually shot this month.`),

    h('div', { className: 'section-label' }, h('span', null, 'Monthly spend'), h('span', null, 'last 6 months')),
    h('div', { className: 'card' }, h(SimpleBarChart, { points: trail, height: 170 })));
}

function SessionDetail({ session, onBack, allSessions }) {

  const sheets = sheetList(session);
  const series = sheets.map(x => x.score);

  const weakIdx = series.length ? series.indexOf(Math.min(...series)) : -1;
  const lines = [];
  if (prev) lines.push(`Observed: score ${session.totalScore >= prev.totalScore ? 'improved' : 'dropped'} by ${Math.abs(round1(session.totalScore - prev.totalScore))} points versus the previous session.`);

      h('div', { className: 'section-label' }, 'Sheet photos'),
      h('div', { className: 'thumb-strip' }, sheets.filter(x => x.photoKey).map((x, i) =>
        h('img', { key: i, src: `/api/photo?key=${x.photoKey}`, alt: `Sheet ${x.sheet}`, loading: 'lazy' })))),
    series.length > 0 && h(React.Fragment, null,
      h('div', { className: 'section-label' }, `Sheets — ${sheets.length} × ${SHOTS_PER_SHEET} shots`),
      h('div', { className: 'card' }, h(SimpleBarChart, { points: sheets.map(x => ({ label: '#' + x.sheet, value: x.score })), colorFn: i => i === strongIdx ? '#059669' : i === weakIdx ? '#dc2626' : '#d97706' })),
      sheets.length > 1 && h('div', { className: 'card' },
        h('div', { className: 'hist-row' }, h('span', null, 'Best sheet'), h('span', { className: 'mono' }, `#${sheets[strongIdx].sheet} — ${series[strongIdx]}`)),
        h('div', { className: 'hist-row' }, h('span', null, 'Weakest sheet'), h('span', { className: 'mono' }, `#${sheets[weakIdx].sheet} — ${series[weakIdx]}`)),
        h('div', { className: 'hist-row' }, h('span', null, 'Average per sheet'), h('span', { className: 'mono' }, round1(avg(series)))))),
    h('div', { className: 'section-label' }, 'Session analysis'),
    h('div', { className: 'card' }, lines.map((l, i) => h('p', { key: i, style: { margin: i === 0 ? 0 : '8px 0 0', fontSize: 13, color: 'var(--text-mute)', lineHeight: 1.5 } }, l))),
    session.notes && (session.notes.feltLike || session.notes.wentWell || session.notes.improve) && h(React.Fragment, null,
      h('div', { className: 'section-label' }, 'Notes'),
      h('div', { className: 'card' },
        session.notes.feltLike && h('p', { style: { margin: '0 0 8px', fontSize: 13 } }, h('strong', null, 'Felt like: '), session.notes.feltLike),
        session.notes.wentWell && h('p', { style: { margin: '0 0 8px', fontSize: 13 } }, h('strong', null, 'Went well: '), session.notes.wentWell),
        session.notes.improve && h('p', { style: { margin: 0, fontSize: 13 } }, h('strong', null, 'To improve: '), session.notes.improve))));

/* ---------- Add session flow ---------- */
function AddSessionFlow({ onCancel, onSave, existingSessions }) {
  const [step, setStep] = useState(1);
  const [date, setDate] = useState(new Date().toISOString().slice(0, 10));
  const [extracting, setExtracting] = useState(false);
  const [extractNote, setExtractNote] = useState(null);
  const [photoKey, setPhotoKey] = useState(null);
  const [fields, setFields] = useState({ sessionNumber: '', discipline: '10m Air Pistol', distance: '10', xCount: '' });
  // Each sheet = 10 shots, max 100. Default to 3 sheets, the usual practice day.
  const [sheets, setSheets] = useState([{ sheet: '1', score: '' }, { sheet: '2', score: '' }, { sheet: '3', score: '' }]);
  const [breakdown, setBreakdown] = useState({ ten: '', nine: '', eight: '', seven: '', six: '', fiveDown: '' });
  const [notes, setNotes] = useState({ feltLike: '', wentWell: '', improve: '' });
  const [saving, setSaving] = useState(false);
  const [calcFor, setCalcFor] = useState(null);
  const [uploadingIdx, setUploadingIdx] = useState(null);
  const [zoomSrc, setZoomSrc] = useState(null);
  const [cropFor, setCropFor] = useState(null);
  const sheetFileRefs = useRef({});
  const fileRef = useRef(null);
  const existingForDate = existingSessions.filter(s => s.date === date);
  // Default to the next session number for this date.
  useEffect(() => {
    if (!fields.sessionNumber) setFields(f => ({ ...f, sessionNumber: String(existingForDate.length + 1) }));
  }, [date]);

  function handleFile(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const base64 = reader.result.split(',')[1];
      setExtracting(true);
      setExtractNote(null);
      api.extract(base64, file.type || 'image/jpeg').then(result => {
        setExtracting(false);
        setPhotoKey(result.photoKey);
        if (result.extractionError === 'no_api_key') setExtractNote('Photo saved, but automatic reading isn\u2019t set up yet — enter the scores below.');
        else if (result.extractionError) setExtractNote('Couldn\u2019t read that sheet automatically — enter the scores below.');
        else if (result.extracted) setExtractNote('Extracted from your photo — check every field before saving.');
        const r = result.extracted || {};
        setFields({
          sessionNumber: r.sessionNumber ?? '', discipline: r.discipline || '10m Air Pistol',
          distance: r.distance || '10', xCount: r.xCount ?? '',
        });
        // A photographed sheet is normally one 10-shot sheet: use its total as that sheet's score.
        if (r.totalScore != null) {
          setSheets([{ sheet: String(r.sessionNumber ?? 1), score: String(r.totalScore) }]);
        } else if (Array.isArray(r.series) && r.series.length) {
          setSheets(r.series.map((v, i) => ({ sheet: String(i + 1), score: String(v) })));
        }
        if ([r.tenCount, r.nineCount, r.eightCount, r.sevenCount, r.sixCount, r.fiveOrBelowCount].some(v => v != null)) {
          setBreakdown({ ten: r.tenCount ?? '', nine: r.nineCount ?? '', eight: r.eightCount ?? '', seven: r.sevenCount ?? '', six: r.sixCount ?? '', fiveDown: r.fiveOrBelowCount ?? '' });
        }
        if (r.date) setDate(r.date);
        setStep(3);
      }).catch(() => { setExtracting(false); setExtractNote('Something went wrong reading that photo — enter the scores below.'); setStep(3); });
    };
    reader.readAsDataURL(file);
  }

  function updateField(k, v) { setFields(f => ({ ...f, [k]: v })); }
  function updateSheet(i, key, v) { setSheets(s => { const n = [...s]; n[i] = { ...n[i], [key]: v }; return n; }); }
  function addSheet() { setSheets(s => [...s, { sheet: String(s.length + 1), score: '' }]); }
  function removeSheet(i) { setSheets(s => s.length > 1 ? s.filter((_, idx) => idx !== i) : s); }

  // Calculator: tapping shots fills that sheet's score and remembers the individual shots.
  function finishCalc(shotsTapped) {
    const total = shotsTapped.reduce((a, s) => a + s.value, 0);
    setSheets(s => { const n = [...s]; n[calcFor] = { ...n[calcFor], score: String(total), shots: shotsTapped }; return n; });
    setCalcFor(null);
  }

  // Attach a photo to one sheet row — offer cropping first.
  function handleSheetPhoto(i, file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => setCropFor({ index: i, src: reader.result });
    reader.readAsDataURL(file);
  }

  function uploadCropped(i, dataUrl) {
    setCropFor(null);
    const base64 = dataUrl.split(',')[1];
    // Show the photo straight away, before the upload finishes.
    updateSheet(i, 'preview', dataUrl);
    setUploadingIdx(i);
    {
      api.extract(base64, file.type || 'image/jpeg').then(result => {
        setUploadingIdx(null);
        setSheets(s => {
          const n = [...s];
          const r = result.extracted || {};
          const counts = {
            ten: r.tenCount, nine: r.nineCount, eight: r.eightCount,
            seven: r.sevenCount, six: r.sixCount, fiveDown: r.fiveOrBelowCount,
          };
          n[i] = {
            ...n[i],
            photoKey: result.photoKey,
            // Score and shot counts read off this sheet, if the photo could be read.
            score: n[i].score || (r.totalScore != null ? String(r.totalScore) : ''),
            extracted: Object.values(counts).some(v => v != null) ? counts : null,
            readFailed: !!result.extractionError,
          };
          return n;
        });
      }).catch(() => { setUploadingIdx(null); updateSheet(i, 'readFailed', true); });
    }
  }

  // Totals are derived from the sheets — no separate typing needed.
  const filledSheets = sheets.filter(s => s.score !== '' && !Number.isNaN(parseFloat(s.score)));
  const liveTotal = filledSheets.reduce((a, s) => a + parseFloat(s.score), 0);
  const liveMax = filledSheets.length * MAX_PER_SHEET;
  const liveShots = filledSheets.length * SHOTS_PER_SHEET;
  const canSave = filledSheets.length > 0;

  // Live tally of every shot tapped into the calculator today, across all sheets.
  const tappedShots = filledSheets.flatMap(s => s.shots || []);
  const tally = {
    ten: tappedShots.filter(s => s.value === 10).length,
    nine: tappedShots.filter(s => s.value === 9).length,
    eight: tappedShots.filter(s => s.value === 8).length,
    seven: tappedShots.filter(s => s.value === 7).length,
    six: tappedShots.filter(s => s.value === 6).length,
    fiveDown: tappedShots.filter(s => s.value <= 5).length,
    x: tappedShots.filter(s => s.x).length,
  };
  const sheetsWithShots = filledSheets.filter(s => (s.shots || []).length);

  // When moving to the last step, pre-fill the breakdown from tapped shots or photo-read counts.
  function goToNotes() {
    const allShots = filledSheets.flatMap(s => s.shots || []);
    const sum = key => filledSheets.reduce((a, s) => a + (s.extracted ? Number(s.extracted[key]) || 0 : 0), 0);
    const anyPhotoCounts = filledSheets.some(s => s.extracted);
    if (allShots.length) {
      setBreakdown({
        ten: String(allShots.filter(s => s.value === 10).length), nine: String(allShots.filter(s => s.value === 9).length),
        eight: String(allShots.filter(s => s.value === 8).length), seven: String(allShots.filter(s => s.value === 7).length),
        six: String(allShots.filter(s => s.value === 6).length), fiveDown: String(allShots.filter(s => s.value <= 5).length),
      });
    } else if (anyPhotoCounts) {
      setBreakdown({ ten: String(sum('ten')), nine: String(sum('nine')), eight: String(sum('eight')),
        seven: String(sum('seven')), six: String(sum('six')), fiveDown: String(sum('fiveDown')) });
    }
    setStep(4);
  }

  function handleSave() {
    const sheetObjs = filledSheets.map((s, i) => ({
      sheet: Number(s.sheet) || i + 1, score: parseFloat(s.score),
      shots: s.shots || [], photoKey: s.photoKey || null,
    }));
    // If shots were tapped in, the breakdown and X count come for free.
    const allShots = sheetObjs.flatMap(s => s.shots);
    const autoBreakdown = allShots.length ? {
      ten: allShots.filter(s => s.value === 10).length,
      nine: allShots.filter(s => s.value === 9).length,
      eight: allShots.filter(s => s.value === 8).length,
      seven: allShots.filter(s => s.value === 7).length,
      six: allShots.filter(s => s.value === 6).length,
      fiveDown: allShots.filter(s => s.value <= 5).length,
    } : null;
    const autoX = allShots.filter(s => s.x).length;
    // Counts read off the uploaded photos, summed across today's sheets.
    const photoSheets = filledSheets.filter(s => s.extracted);
    const photoBreakdown = photoSheets.length ? photoSheets.reduce((acc, s) => ({
      ten: acc.ten + (Number(s.extracted.ten) || 0), nine: acc.nine + (Number(s.extracted.nine) || 0),
      eight: acc.eight + (Number(s.extracted.eight) || 0), seven: acc.seven + (Number(s.extracted.seven) || 0),
      six: acc.six + (Number(s.extracted.six) || 0), fiveDown: acc.fiveDown + (Number(s.extracted.fiveDown) || 0),
    }), { ten: 0, nine: 0, eight: 0, seven: 0, six: 0, fiveDown: 0 }) : null;
    const typedBreakdown = Object.values(breakdown).some(v => v !== '') ? {
      ten: Number(breakdown.ten) || 0, nine: Number(breakdown.nine) || 0, eight: Number(breakdown.eight) || 0,
      seven: Number(breakdown.seven) || 0, six: Number(breakdown.six) || 0, fiveDown: Number(breakdown.fiveDown) || 0,
    } : null;
    const draft = {
      date, sessionNumber: fields.sessionNumber ? Number(fields.sessionNumber) : null, discipline: fields.discipline,
      distance: fields.distance ? `${fields.distance} m` : '', totalShots: allShots.length || liveShots,
      totalScore: liveTotal, maxScore: liveMax,
      xCount: Number(fields.xCount) || autoX,
      series: sheetObjs,
      shotBreakdown: autoBreakdown || photoBreakdown || typedBreakdown,
      notes, photoKey,
    };
    setSaving(true);
    onSave(draft).catch(() => setSaving(false));
  }

  return h('div', { className: 'content', style: { paddingTop: 20 } },
    h('div', { className: 'add-flow-inner' },
    h('div', { className: 'back-row', onClick: onCancel }, '✕ Cancel'),
    h('h2', { style: { margin: '0 0 16px', fontSize: 19, fontWeight: 700 } }, 'Log session'),
    h('div', { className: 'steps' }, [1, 3, 4].map(n => h('div', { key: n, className: `step-dot ${step >= n ? 'done' : ''}` }))),

    step === 1 && h(React.Fragment, null,
      h('div', { className: 'field' }, h('label', { className: 'label' }, 'Practice date'),
        h('input', { type: 'date', className: 'input', value: date, onChange: e => setDate(e.target.value) })),
      existingForDate.length > 0 && h('p', { style: { fontSize: 12.5, color: 'var(--warn-text)', marginBottom: 14 } },
        `${existingForDate.length} session(s) already logged for this date — this will be added as another one.`),
      h('button', { className: 'btn-primary', onClick: () => setStep(3) }, 'Continue')),

    step === 3 && h(React.Fragment, null,
      extractNote && h('p', { style: { fontSize: 12.5, color: 'var(--text-mute)', marginBottom: 12 } }, extractNote),
      h('div', { className: 'row2' },
        h('div', { className: 'field' }, h('label', { className: 'label' }, 'Session of the day'),
          h('select', { className: 'select', value: fields.sessionNumber, onChange: e => updateField('sessionNumber', e.target.value) },
            h('option', { value: '' }, 'Session —'),
            [1, 2, 3, 4, 5].map(n => h('option', { key: n, value: String(n) }, `Session ${n}`)))),
        h('div', { className: 'field' }, h('label', { className: 'label' }, 'Distance (m)'), h('input', { className: 'input mono', value: fields.distance, onChange: e => updateField('distance', e.target.value) }))),
      h('div', { className: 'field' }, h('label', { className: 'label' }, 'Discipline'), h('input', { className: 'input', value: fields.discipline, onChange: e => updateField('discipline', e.target.value) })),

      h('div', { className: 'card', style: { marginBottom: 12, padding: '10px 14px' } },
        h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' } },
          h('span', { style: { fontSize: 13.5, fontWeight: 600 } }, fmtLong(date)),
          h('span', { style: { fontSize: 12, color: 'var(--text-mute)' } }, fields.sessionNumber ? `Session ${fields.sessionNumber}` : ''))),
      h('div', { className: 'section-label', style: { marginTop: 0 } }, h('span', null, 'Scoring upload'), h('span', null, `${SHOTS_PER_SHEET} shots per sheet`)),
      sheets.map((s, i) => h('div', { key: i, className: 'card', style: { padding: 12, marginBottom: 8 } },
        h('div', { style: { display: 'grid', gridTemplateColumns: '64px 1fr 30px', gap: 8, alignItems: 'center' } },
          h('input', { className: 'input mono', style: { textAlign: 'center', padding: '9px 4px' }, value: s.sheet, onChange: e => updateSheet(i, 'sheet', e.target.value), 'aria-label': 'Sheet number' }),
          h('input', { className: 'input mono', value: s.score, onChange: e => updateSheet(i, 'score', e.target.value), placeholder: `Score / ${MAX_PER_SHEET}`, inputMode: 'numeric' }),
          h('button', { className: 'btn-ghost', style: { justifyContent: 'center', fontSize: 18 }, onClick: () => removeSheet(i), 'aria-label': 'Remove sheet' }, '×')),
        h('div', { style: { display: 'flex', gap: 8, marginTop: 8 } },
          h('button', { className: 'btn-secondary', style: { padding: '9px', fontSize: 13 }, onClick: () => setCalcFor(i) },
            s.shots && s.shots.length ? `Shots: ${s.shots.length} tapped` : 'Score shot by shot'),
          h('input', { type: 'file', accept: 'image/*', capture: 'environment', style: { display: 'none' },
            ref: el => { sheetFileRefs.current[i] = el; },
            onChange: e => handleSheetPhoto(i, e.target.files && e.target.files[0]) }),
          h('button', { className: 'btn-secondary', style: { padding: '9px', fontSize: 13, flex: '0 0 44%' },
            onClick: () => sheetFileRefs.current[i] && sheetFileRefs.current[i].click() },
            uploadingIdx === i ? 'Saving…' : (s.preview || s.photoKey) ? 'Replace photo' : 'Photo')),
        (s.preview || s.photoKey) && h('div', { style: { marginTop: 10 } },
          h('img', {
            src: s.preview || `/api/photo?key=${s.photoKey}`,
            alt: `Sheet ${s.sheet}`,
            onClick: () => setZoomSrc(s.preview || `/api/photo?key=${s.photoKey}`),
            style: { width: '100%', maxHeight: 220, objectFit: 'cover', borderRadius: 4, border: '1px solid var(--line)', cursor: 'zoom-in' } }),
          uploadingIdx === i && h('p', { style: { fontSize: 11.5, color: 'var(--text-mute)', margin: '5px 0 0' } }, 'Saving photo…'),
          s.extracted && h('p', { style: { fontSize: 11.5, color: 'var(--good-text)', margin: '5px 0 0' } }, 'Shot counts read from this photo — check them on the next step.'),
          s.readFailed && !s.extracted && h('p', { style: { fontSize: 11.5, color: 'var(--text-mute)', margin: '5px 0 0' } }, 'Photo saved. Couldn\u2019t read the numbers automatically — enter the score above or tap them in.')))),
      h('button', { className: 'btn-secondary', style: { marginBottom: 14 }, onClick: addSheet }, '+ Add another sheet'),

      filledSheets.length > 0 && h('div', { className: 'card', style: { marginBottom: 14 } },
        h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' } },
          h('span', { style: { fontSize: 12.5, color: 'var(--text-mute)' } }, `${filledSheets.length} sheet${filledSheets.length > 1 ? 's' : ''} · ${liveShots} shots`),
          h('span', { className: 'mono', style: { fontSize: 20, fontWeight: 700 } }, `${liveTotal} / ${liveMax}`))),

      h('div', { className: 'field' }, h('label', { className: 'label' }, 'X / inner-10 count (optional)'),
        h('input', { className: 'input mono', value: fields.xCount, onChange: e => updateField('xCount', e.target.value), inputMode: 'numeric' })),
      h('button', { className: 'btn-primary', disabled: !canSave, onClick: goToNotes }, 'Continue')),

    step === 4 && h(React.Fragment, null,
      tappedShots.length > 0 && h(React.Fragment, null,
        h('div', { className: 'section-label', style: { marginTop: 0 } },
          h('span', null, "Today's shots"),
          h('span', null, `${tappedShots.length} shots · ${sheetsWithShots.length} sheet${sheetsWithShots.length > 1 ? 's' : ''}`)),
        h('div', { className: 'card' },
          h('div', { className: 'tally-grid' },
            [['10s', tally.ten, 'var(--good-text)'], ['9s', tally.nine, 'var(--good-text)'], ['8s', tally.eight, 'var(--warn-text)'],
             ['7s', tally.seven, 'var(--warn-text)'], ['6s', tally.six, 'var(--bad-text)'], ['≤5', tally.fiveDown, 'var(--bad-text)']]
              .map(([label, count, color]) => h('div', { key: label, className: 'tally-cell' },
                h('div', { className: 'tally-num', style: { color } }, count),
                h('div', { className: 'tally-lab' }, label)))),
          h('div', { style: { display: 'flex', justifyContent: 'space-between', marginTop: 12, paddingTop: 12, borderTop: '1px solid var(--line)', fontSize: 13 } },
            h('span', { style: { color: 'var(--text-mute)' } }, `X count: `, h('span', { className: 'mono', style: { color: 'var(--warn-text)' } }, tally.x)),
            h('span', { style: { color: 'var(--text-mute)' } }, `9+ : `, h('span', { className: 'mono', style: { color: 'var(--text)' } },
              `${round1(((tally.ten + tally.nine) / tappedShots.length) * 100)}%`))),
          sheetsWithShots.length > 1 && h('div', { style: { marginTop: 12, paddingTop: 12, borderTop: '1px solid var(--line)' } },
            sheetsWithShots.map((s, i) => {
              const sh = s.shots || [];
              return h('div', { key: i, style: { display: 'flex', justifyContent: 'space-between', fontSize: 12.5, padding: '4px 0', color: 'var(--text-mute)' } },
                h('span', null, `Sheet ${s.sheet}`),
                h('span', { className: 'mono' }, `${sh.filter(x => x.value === 10).length}×10 · ${sh.filter(x => x.value === 9).length}×9 · ${sh.filter(x => x.value === 8).length}×8 — ${s.score}`));
            })))),

      h('p', { className: 'label', style: { marginBottom: 8 } }, tappedShots.length > 0
        ? 'Adjust if needed — these were counted from your calculator entries'
        : 'Shot value breakdown (optional) — across all sheets today'),
      h('div', { className: 'breakdown-grid' }, [['ten', '10s'], ['nine', '9s'], ['eight', '8s'], ['seven', '7s'], ['six', '6s'], ['fiveDown', '≤5']].map(([k, label]) =>
        h('div', { key: k, className: 'breakdown-field' }, h('label', null, label), h('input', { value: breakdown[k], onChange: e => setBreakdown({ ...breakdown, [k]: e.target.value }), placeholder: '0' })))),
      h('div', { className: 'field', style: { marginTop: 18 } }, h('label', { className: 'label' }, "How did today's session feel?"), h('textarea', { className: 'textarea', value: notes.feltLike, onChange: e => setNotes({ ...notes, feltLike: e.target.value }) })),
      h('div', { className: 'field' }, h('label', { className: 'label' }, 'What went well?'), h('textarea', { className: 'textarea', value: notes.wentWell, onChange: e => setNotes({ ...notes, wentWell: e.target.value }) })),
      h('div', { className: 'field' }, h('label', { className: 'label' }, 'What needs improvement?'), h('textarea', { className: 'textarea', value: notes.improve, onChange: e => setNotes({ ...notes, improve: e.target.value }) })),
      h('button', { className: 'btn-primary', disabled: saving, onClick: handleSave }, saving ? 'Saving…' : 'Save session'),
      h('p', { style: { textAlign: 'center', color: 'var(--warn-text)', fontSize: 14, margin: '16px 0 4px' } }, 'Good day at the shooting. Thank you.')),
    calcFor !== null && h(ShotCalculator, {
      sheetNumber: sheets[calcFor] ? sheets[calcFor].sheet : '',
      initialShots: sheets[calcFor] ? sheets[calcFor].shots : [],
      onDone: finishCalc,
      onCancel: () => setCalcFor(null),
    }),
    cropFor && h(CropTool, {
      src: cropFor.src,
      onDone: dataUrl => uploadCropped(cropFor.index, dataUrl),
      onCancel: () => setCropFor(null),
    }),
    zoomSrc && h('div', { className: 'lightbox', onClick: () => setZoomSrc(null) },
      h('img', { src: zoomSrc, alt: 'Sheet' }),
      h('button', { className: 'btn-ghost', style: { marginTop: 12 }, onClick: () => setZoomSrc(null) }, 'Close'))
  ));
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
}

</script>
</body>
</html>
